{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Task Tracker{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="navbar">
    <div class="container">

        <a href="{% url 'task-list' %}" class="brand">
            Task Tracker
        </a>

        {% if user.is_authenticated %}

            <div class="nav-right">

                <span>
                    Welcome, {{ user.username }}
                </span>

                <a href="{% url 'task-create' %}">
                    Create Task
                </a>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                >
                    {% csrf_token %}
                    <button type="submit">
                        Logout
                    </button>
                </form>

            </div>

        {% endif %}

    </div>
</header>


<main class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
