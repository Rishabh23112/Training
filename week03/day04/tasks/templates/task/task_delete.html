{% extends "base.html" %}

{% block title %}
Delete Task
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Delete Task</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Delete
        </button>

        <a href="{% url 'task-list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
