{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Login</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        {% if form.non_field_errors %}
            <div class="error">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
