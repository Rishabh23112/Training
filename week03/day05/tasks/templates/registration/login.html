{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <h1>Task Tracker</h1>

            {% if form.errors %}
                <div class="error-box">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="form-group">

                    <label for="id_username">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >

                </div>


                <div class="form-group">

                    <label for="id_password">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
