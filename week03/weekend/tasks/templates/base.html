{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Task Tracker
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="navbar">

    <div class="navbar-brand">
        <a href="{% url 'task-list' %}">
            Task Tracker
        </a>
    </div>

    <nav>

        {% if user.is_authenticated %}

            <a href="{% url 'task-list' %}">
                Tasks
            </a>

            <a href="{% url 'task-create' %}">
                Create Task
            </a>

            <form
                method="post"
                action="{% url 'logout' %}"
                class="logout-form"
            >
                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>
            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% if messages %}

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}
    {% endblock %}

</main>

</body>
</html>
