{% extends "base.html" %}


{% block title %}
    Delete Task
{% endblock %}


{% block content %}

<div class="confirm-card">

    <h1>Delete Task</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <p class="delete-title">
        "{{ object.title }}"
    </p>


    <div class="confirm-actions">

        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                Yes, Delete
            </button>

        </form>


        <a
            href="{% url 'task-list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </div>

</div>

{% endblock %}
