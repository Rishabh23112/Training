{% extends "base.html" %}

{% block title %}
    Login | Task Tracker
{% endblock %}


{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Login</h1>

        {% if form.errors %}
            <div class="message message-error">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
