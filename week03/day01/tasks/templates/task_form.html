{% extends "base.html" %}


{% block title %}
    Task Form
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>

        {% if object %}
            Edit Task
        {% else %}
            Create Task
        {% endif %}

    </h1>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-success"
            >

                {% if object %}
                    Update Task
                {% else %}
                    Create Task
                {% endif %}

            </button>


            <a
                href="{% url 'task-list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
