{% extends "base.html" %}
{% block title %}Task List  {% endblock %}

{% block content %}

<div class="dashboard-header">
    <div>
        <h1 class="dashboard-title">Tasks</h1>
    </div>

    <span class="count-pill">Total Tasks: {{tasks|length}}</span>

</div>

<div class="task-grid">
    {% for task in tasks %}
        {% include "components/task_card.html" with task=task   %}
    {% empty %}

    <p>No tasks available</>

    {% endfor%}
</div>

{% endblock %}
