{% extends "tasks/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<main class="container">
    <h1>Delete Task</h1>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>

    <a href="{% url 'task-list' %}">Cancel</a>
</main>
{% endblock %}
